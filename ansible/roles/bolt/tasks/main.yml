---
# MediaBuilder (Bolt CMS) for OpenWell content packages: MySQL, PHP and its own
# nginx in Docker (ConnectBox/mediabuilder docker-compose.yml), published on
# port 3000.  The host nginx (webserver role) serves it as bolt.<url>.

- name: Install mediabuilder repo
  git:
    repo: 'https://github.com/ConnectBox/mediabuilder.git'
    dest: "{{ document_root }}/mediabuilder"
    version: main
    force: yes
    update: yes

# Bolt writes caches, uploads and exports inside the checkout (bind-mounted
# into the php container), so it must be writable from the container.
- name: Make the mediabuilder checkout writable for the containers
  file:
    path: "{{ document_root }}/mediabuilder"
    recurse: yes
    mode: "u+rwX,g+rwX,o+rwX"

- name: Write mediabuilder .env (secrets from secrets.yml)
  template:
    src: env
    dest: "{{ document_root }}/mediabuilder/.env"
    mode: "0644"

- name: Write the exporter settings
  template:
    src: exporter.yaml
    dest: "{{ document_root }}/mediabuilder/config/bolt/exporter.yaml"

- name: Build and start mediabuilder (docker compose up -d --build)
  command: docker compose up -d --build
  args:
    chdir: "{{ document_root }}/mediabuilder"
  changed_when: true

- name: Wait for mediabuilder on port 3000
  wait_for:
    host: localhost
    port: 3000
    timeout: 300

- name: Show the remaining manual step
  debug:
    msg: >-
      First install only: initialise Bolt's database and create its admin user with
      'docker exec -it php bin/console bolt:setup' on the server (answer NO to
      "Add fixtures").
