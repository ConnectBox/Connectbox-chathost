---
# chathost: box sync APIs and dashboard (Node, in the node:16 container from
# docker-compose.yml), listening on 127.0.0.1-reachable port 2820.

- name: Install git and Node.js (Node runs the per-minute system.js health check)
  apt:
    name:
      - git
      - nodejs
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create the install directory
  file:
    path: "{{ document_root }}"
    state: directory
    mode: "0755"

- name: Install chathost repo
  git:
    repo: 'https://github.com/ConnectBox/connectbox-chathost.git'
    dest: "{{ document_root }}/chathost"
    version: main
    force: yes
    update: yes

# npm runs inside the same node:16 image the app runs in, using the committed
# package-lock.json (npm ci), so every server gets the same package versions.
- name: Install node packages (npm ci in node:16)
  command: >
    docker run --rm -v {{ document_root }}/chathost:/usr/src -w /usr/src
    node:16 npm ci --omit=dev
  changed_when: true

- name: Write chathost .env (secrets from secrets.yml)
  template:
    src: env
    dest: "{{ document_root }}/chathost/.env"
    mode: "0600"

- name: Start chathost (docker compose up -d)
  command: docker compose up -d
  args:
    chdir: "{{ document_root }}/chathost"
  changed_when: true

- name: Wait for chathost on port 2820
  wait_for:
    host: localhost
    port: 2820
    timeout: 120

- name: Run the system health check every minute
  cron:
    name: "system.js"
    minute: "*"
    user: root
    job: "cd {{ document_root }}/chathost && /usr/bin/node src/system.js >/tmp/systemjs.log 2>&1"
