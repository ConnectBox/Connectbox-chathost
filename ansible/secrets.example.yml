# Server secrets - copy to secrets.yml (git-ignored) and fill in new values.
# Optionally encrypt it:  ansible-vault encrypt secrets.yml
# and then run the playbook with --ask-vault-pass.
#
# Use letters and digits only (no @ : / # %): the password also goes into
# MediaBuilder's DATABASE_URL.  Generate values with e.g.
#   openssl rand -hex 16     (password)
#   openssl rand -hex 32     (bolt_app_secret)

# Chathost dashboard "admin" password and MediaBuilder's MySQL password
password: CHANGE_ME

# Symfony APP_SECRET for MediaBuilder (Bolt)
bolt_app_secret: CHANGE_ME

# Signs the chathost dashboard's login cookies (openssl rand -hex 32)
session_key: CHANGE_ME
